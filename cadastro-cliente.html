<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Cadastro — Ascentria</title>
<style>
  :root{
    --bg:#f7f5ef; --card:#ffffff; --ink:#22261d; --ink-dim:#6b7263;
    --accent:#5c6b47; --accent-dark:#454f36; --accent-soft:#e9edE0;
    --border:#e2ded1; --danger:#b3452f; --danger-soft:#fbeae5;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px;min-height:100vh;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brand .logo{width:58px;height:58px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .brand .logo img{width:100%;height:100%;object-fit:contain;padding:5px;}
  .brand .txt{font-size:13px;color:var(--ink-dim);}
  .brand .txt b{color:var(--ink);display:block;font-size:15px;}
  .progress-track{height:6px;border-radius:6px;background:var(--border);overflow:hidden;margin-bottom:30px;}
  .progress-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .35s ease;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px 28px;box-shadow:0 2px 18px rgba(30,30,20,0.05);flex:1;display:flex;flex-direction:column;}
  .step-tag{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
  .step-q{font-size:22px;font-weight:700;line-height:1.35;margin:0 0 6px;}
  .step-hint{font-size:13.5px;color:var(--ink-dim);margin:0 0 22px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-dim);margin-bottom:6px;}
  .field input[type=text],.field input[type=email],.field input[type=date],.field input[type=tel],
  .field select,.field textarea{
    width:100%;padding:12px 14px;font-size:15.5px;border:1.5px solid var(--border);border-radius:10px;
    background:#fff;color:var(--ink);font-family:inherit;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;}
  .field-error{font-size:12.5px;color:var(--danger);margin-top:5px;display:none;}
  .field.invalid input,.field.invalid select{border-color:var(--danger);background:var(--danger-soft);}
  .field.invalid .field-error{display:block;}
  .optional-badge{font-weight:400;color:var(--ink-dim);text-transform:none;font-size:11.5px;margin-left:6px;}
  .cep-row{display:flex;gap:10px;align-items:flex-end;}
  .cep-row .field{flex:1;margin-bottom:0;}
  .btn-cep{padding:12px 16px;border-radius:10px;border:1.5px solid var(--accent);background:#fff;color:var(--accent);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;}
  .btn-cep:hover{background:var(--accent-soft);}
  .cep-status{font-size:12.5px;margin-top:8px;color:var(--ink-dim);display:none;align-items:center;gap:6px;}
  .cep-status.show{display:flex;}
  .cep-status.ok{color:var(--accent-dark);}
  .cep-status.err{color:var(--danger);}
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:var(--ink);user-select:none;transition:all .12s;}
  .chip:hover{border-color:var(--accent);}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .actions{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:26px;}
  .btn-primary{background:var(--accent);color:#fff;border:none;padding:13px 26px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-back{background:none;border:none;color:var(--ink-dim);font-size:14px;font-weight:600;cursor:pointer;padding:10px;}
  .btn-back:hover{color:var(--ink);}
  .btn-skip{background:none;border:none;color:var(--ink-dim);font-size:13px;text-decoration:underline;cursor:pointer;padding:0;margin-top:2px;}
  .kbd-hint{font-size:12px;color:var(--ink-dim);margin-top:14px;}
  .kbd-hint kbd{background:var(--accent-soft);border-radius:4px;padding:1px 6px;font-family:inherit;font-size:11px;}
  .review-list{display:flex;flex-direction:column;gap:0;margin-bottom:6px;}
  .review-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .review-row .k{color:var(--ink-dim);flex-shrink:0;}
  .review-row .v{font-weight:600;text-align:right;}
  .review-row button{background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;padding:0;margin-left:10px;}
  .success-icon{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .success-icon svg{width:30px;height:30px;stroke:var(--accent-dark);}
  .center{text-align:center;}
  .table-wrap{margin-top:26px;overflow-x:auto;}
  table.records{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.records th,table.records td{border:1px solid var(--border);padding:7px 9px;text-align:left;white-space:nowrap;}
  table.records th{background:var(--accent-soft);font-weight:700;}
  .note-box{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--accent-dark);margin-top:18px;}
</style>
</head>

/* ================= ESTADO DO FORMULÁRIO =================
   Sem TAG aqui: quem classifica o cadastro (TAG) é a equipe interna, depois, dentro da plataforma —
   ver Painel Interno > Registro de Clientes. */
let data = {

/* ================= VALIDAÇÃO ================= */
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }
function validaCPF(v){
  const cpf = onlyDigits(v);
  if(cpf.length!==11 || /^(\d)\1{10}$/.test(cpf)) return false;
  let soma=0; for(let i=0;i<9;i++) soma += parseInt(cpf[i])*(10-i);
  let r = (soma*10)%11; if(r>=10) r=0;
  if(r !== parseInt(cpf[9])) return false;
  soma=0; for(let i=0;i<10;i++) soma += parseInt(cpf[i])*(11-i);
  r = (soma*10)%11; if(r>=10) r=0;
  return r === parseInt(cpf[10]);
}
function validaCNPJ(v){
  const cnpj = onlyDigits(v);
  if(cnpj.length!==14 || /^(\d)\1{13}$/.test(cnpj)) return false;
  const calc = (base)=>{
    let pesos = base.length===12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    let soma=0; for(let i=0;i<base.length;i++) soma += parseInt(base[i])*pesos[i];
    let r = soma%11; return r<2? 0 : 11-r;
  };
  const d1 = calc(cnpj.slice(0,12));
  if(d1 !== parseInt(cnpj[12])) return false;
  const d2 = calc(cnpj.slice(0,13));
  return d2 === parseInt(cnpj[13]);
}
function maskCPF(v){ return onlyDigits(v).slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); }
function maskCNPJ(v){ return onlyDigits(v).slice(0,14).replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2'); }
function maskCEP(v){ return onlyDigits(v).slice(0,8).replace(/(\d{5})(\d{1,3})$/,'$1-$2'); }
function maskFone(v){
  const d = onlyDigits(v).slice(0,11);
  if(d.length<=10) return d.replace(/(\d{2})(\d{4})(\d{0,4})/,(m,a,b,c)=>c? `(${a}) ${b}-${c}` : (b? `(${a}) ${b}`:`(${a}`));
  return d.replace(/(\d{2})(\d{5})(\d{0,4})/,(m,a,b,c)=>c? `(${a}) ${b}-${c}` : `(${a}) ${b}`);
}
function validaEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

/* ================= INTEGRAÇÕES EXTERNAS (ViaCEP / IBGE) =================
   Ambas são APIs públicas, gratuitas e sem necessidade de chave — funcionam direto do navegador.
   Se o dispositivo estiver offline (ou o navegador bloquear a chamada), cai no modo manual sem travar
   o preenchimento — os campos continuam editáveis normalmente. */
async function buscarCEP(cep){
  const digits = onlyDigits(cep);
  if(digits.length!==8) return {error:'CEP precisa ter 8 dígitos.'};
  try{
    const res = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
    const json = await res.json();
    if(json.erro) return {error:'CEP não encontrado.'};
    return { endereco: json.logradouro||'', bairro: json.bairro||'', cidade: json.localidade||'', estado: json.uf||'' };
  }catch(e){
    return {error:'Não foi possível consultar o CEP agora — preencha manualmente.'};
  }
}
async function buscarCidades(uf){
  if(cidadesCache[uf]) return cidadesCache[uf];
  try{
    const res = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios`);
    const json = await res.json();
    const nomes = json.map(m=>m.nome).sort((a,b)=>a.localeCompare(b,'pt-BR'));
    cidadesCache[uf] = nomes;
    return nomes;
  }catch(e){
    return null; // sinaliza pro chamador cair no modo texto livre
  }
}

/* ================= RENDER HELPERS ================= */
function fieldHtml(id, label, inputHtml, hintOptional){
  return `<div class="field" id="fieldWrap-${id}">
    <label>${label}${hintOptional? '<span class="optional-badge">opcional</span>':''}</label>
    ${inputHtml}
    <div class="field-error" id="err-${id}"></div>
  </div>`;
}
function showError(id, msg){
  const wrap = document.getElementById('fieldWrap-'+id);
  wrap.classList.add('invalid');
  document.getElementById('err-'+id).textContent = msg;
}
function clearErrors(){
  document.querySelectorAll('.field.invalid').forEach(f=>f.classList.remove('invalid'));
}

function renderNome(container){
  container.innerHTML = fieldHtml('nome','Nome completo', `<input type="text" id="in-nome" value="${data.nome}" placeholder="Ex.: Maria da Silva Souza" autofocus>`);

}
function renderCPF(container){

function renderCNPJ(container){

}
function renderNascimento(container){
  container.innerHTML = fieldHtml('nascimento','Data de nascimento', `<input type="date" id="in-nasc" value="${data.nascimento}" autofocus>`);
  document.getElementById('in-nasc').addEventListener('input', e=> data.nascimento = e.target.value);
}
function renderWhatsapp(container){
  container.innerHTML = fieldHtml('whatsapp','WhatsApp (com DDD)', `<input type="tel" id="in-wpp" inputmode="numeric" value="${data.whatsapp}" placeholder="(00) 00000-0000" autofocus>`);
  const inp = document.getElementById('in-wpp');
  inp.addEventListener('input', e=>{ e.target.value = maskFone(e.target.value); data.whatsapp = e.target.value; });
}
function renderEmail(container){
  container.innerHTML = fieldHtml('email','E-mail', `<input type="email" id="in-email" value="${data.email}" placeholder="nome@email.com" autofocus>`);
  document.getElementById('in-email').addEventListener('input', e=> data.email = e.target.value);
}
function renderCEP(container){
  container.innerHTML = `
    <div class="cep-row">
      ${fieldHtml('cep','CEP', `<input type="text" id="in-cep" inputmode="numeric" value="${data.cep}" placeholder="00000-000" autofocus>`)}
      <button type="button" class="btn-cep" id="btn-buscar-cep">Buscar endereço</button>
    </div>
    <div class="cep-status" id="cep-status"></div>
    <p class="step-hint" style="margin-top:14px">Assim que encontrarmos o endereço, você poderá conferir e ajustar os detalhes na próxima etapa.</p>
  `;
  const inp = document.getElementById('in-cep');
  inp.addEventListener('input', e=>{ e.target.value = maskCEP(e.target.value); data.cep = e.target.value; });
  const buscar = async ()=>{
    const statusEl = document.getElementById('cep-status');
    statusEl.className = 'cep-status show';
    statusEl.textContent = 'Buscando endereço...';
    const r = await buscarCEP(data.cep);
    if(r.error){
      statusEl.className = 'cep-status show err';
      statusEl.textContent = r.error;
      return;
    }
    data.endereco = r.endereco; data.bairro = r.bairro; data.cidade = r.cidade; data.estado = r.estado;
    statusEl.className = 'cep-status show ok';
    statusEl.textContent = 'Endereço encontrado! Avançando...';
    setTimeout(goNext, 500);
  };
  document.getElementById('btn-buscar-cep').addEventListener('click', buscar);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); buscar(); } });
}
function renderEndereco(container){
  container.innerHTML = `
    ${fieldHtml('endereco','Endereço', `<input type="text" id="in-end" value="${data.endereco}" placeholder="Rua, avenida...">`)}
    <div class="row3">
      ${fieldHtml('numero','Número', `<input type="text" id="in-num" value="${data.numero}" placeholder="Ex.: 123">`)}
      ${fieldHtml('complemento','Complemento', `<input type="text" id="in-comp" value="${data.complemento}" placeholder="Apto, bloco...">`, true)}
      ${fieldHtml('bairro','Bairro', `<input type="text" id="in-bairro" value="${data.bairro}" placeholder="Bairro">`)}
    </div>
    <div class="row2">
      ${fieldHtml('estado','Estado', `<select id="in-estado">${estadoOpts(data.estado)}</select>`)}
      ${fieldHtml('cidade','Cidade', `<select id="in-cidade"><option value="">Selecione o estado primeiro</option></select>`)}
    </div>
  `;
  document.getElementById('in-end').addEventListener('input', e=> data.endereco = e.target.value);
  document.getElementById('in-num').addEventListener('input', e=> data.numero = e.target.value);
  document.getElementById('in-comp').addEventListener('input', e=> data.complemento = e.target.value);
  document.getElementById('in-bairro').addEventListener('input', e=> data.bairro = e.target.value);
  const estadoSel = document.getElementById('in-estado');
  estadoSel.addEventListener('change', e=>{ data.estado = e.target.value; data.cidade=''; carregarCidades(e.target.value); });
  if(data.estado) carregarCidades(data.estado, data.cidade);
}
function estadoOpts(current){
  return `<option value="">Selecione</option>` + ESTADOS.map(([uf,nome])=>`<option value="${uf}" ${current===uf?'selected':''}>${nome} (${uf})</option>`).join('');
}
async function carregarCidades(uf, preSelect){
  const sel = document.getElementById('in-cidade');
  if(!sel) return;
  sel.innerHTML = `<option value="">Carregando cidades...</option>`;
  const cidades = await buscarCidades(uf);
  if(!document.getElementById('in-cidade')) return; // usuário já mudou de etapa
  if(!cidades){
    // Fallback: sem internet ou API fora do ar — vira campo de texto livre pra não travar o formulário.
    const wrap = document.getElementById('fieldWrap-cidade');
    wrap.querySelector('label').innerHTML = 'Cidade';
    wrap.innerHTML = wrap.innerHTML.replace(/<select[\s\S]*?<\/select>/, `<input type="text" id="in-cidade" value="${data.cidade||''}" placeholder="Digite a cidade">`);
    document.getElementById('in-cidade').addEventListener('input', e=> data.cidade = e.target.value);
    return;
  }
  sel.innerHTML = `<option value="">Selecione</option>` + cidades.map(c=>`<option value="${c}" ${preSelect===c?'selected':''}>${c}</option>`).join('');
  sel.addEventListener('change', e=> data.cidade = e.target.value);
  if(preSelect) data.cidade = preSelect;
}
function renderComoConheceu(container){
  container.innerHTML = fieldHtml('comoConheceu','Como você nos conheceu?', `<textarea id="in-conheceu" placeholder="Ex.: indicação de uma amiga, Instagram, Google...">${data.comoConheceu}</textarea>`, true);
  document.getElementById('in-conheceu').addEventListener('input', e=> data.comoConheceu = e.target.value);
}
function renderRevisao(container){
  const rows = [
    ['Nome','nome',data.nome],['CPF','cpf',data.cpf],['CNPJ','cnpj',data.cnpj||'—'],
    ['Nascimento','nascimento',formatDateBR(data.nascimento)],['WhatsApp','whatsapp',data.whatsapp],['E-mail','email',data.email],
    ['CEP','cep',data.cep],['Endereço','endereco',`${data.endereco}, ${data.numero}${data.complemento? ' — '+data.complemento:''}`],
    ['Bairro','endereco',data.bairro],['Cidade/UF','endereco',`${data.cidade} / ${data.estado}`],
    ['Como conheceu','comoConheceu',data.comoConheceu||'—'],
  ];
  container.innerHTML = `<div class="review-list">${rows.map(([label,key,val])=>`
    <div class="review-row"><span class="k">${label}</span><span class="v">${escapeHtml(String(val))} <button data-jump="${key}">editar</button></span></div>
  `).join('')}</div>`;
  container.querySelectorAll('[data-jump]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = STEPS.findIndex(s=>s.key===btn.dataset.jump);
      if(idx>-1){ step = idx; renderStep(); }
    });
  });
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDateBR(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

/* ================= VALIDAÇÃO POR ETAPA ================= */
function validateStep(){
  clearErrors();
  const s = STEPS[step];
  let ok = true;
  const need = (cond,id,msg)=>{ if(!cond){ showError(id,msg); ok=false; } };
  switch(s.key){
    case 'nome': need(data.nome.trim().length>=3,'nome','Informe o nome completo.'); break;
    case 'cpf': need(validaCPF(data.cpf),'cpf','CPF inválido — confira os números digitados.'); break;
    case 'cnpj': if(data.cnpj.trim()) need(validaCNPJ(data.cnpj),'cnpj','CNPJ inválido — confira os números, ou pule esta etapa.'); break;
    case 'nascimento': need(!!data.nascimento,'nascimento','Informe a data de nascimento.'); break;
    case 'whatsapp': need(onlyDigits(data.whatsapp).length>=10,'whatsapp','Informe um WhatsApp válido com DDD.'); break;
    case 'email': need(validaEmail(data.email),'email','Informe um e-mail válido.'); break;
    case 'cep': need(onlyDigits(data.cep).length===8,'cep','Informe um CEP válido (8 dígitos).'); break;
    case 'endereco':
      need(data.endereco.trim().length>0,'endereco','Informe o endereço.');
      need(data.numero.trim().length>0,'numero','Informe o número.');
      need(data.bairro.trim().length>0,'bairro','Informe o bairro.');
      need(!!data.estado,'estado','Selecione o estado.');
      need(!!data.cidade,'cidade','Selecione (ou digite) a cidade.');
      break;
  }
  return ok;
}

/* ================= NAVEGAÇÃO ================= */
async function goNext(){
  if(!validateStep()) return;
  if(step < STEPS.length-1){ step++; renderStep(); return; }
  const btn = document.getElementById('btn-next');
  const backBtn = document.getElementById('btn-back');
  const errEl = document.getElementById('submit-error');
  if(errEl) errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Enviando...';
  if(backBtn) backBtn.style.visibility = 'hidden';
  try{
    await finalizarCadastro();
    renderSucesso();
  }catch(e){
    console.error('envio do cadastro', e);
    btn.disabled = false; btn.textContent = 'Enviar cadastro';
    if(backBtn) backBtn.style.visibility = '';
    if(errEl){ errEl.textContent = 'Não foi possível enviar seu cadastro agora. Verifique sua internet e tente novamente.'; errEl.style.display = 'block'; }
  }
}
function goBack(){
  if(step>0){ step--; renderStep(); }
}
function renderStep(){
  const s = STEPS[step];
  const pct = Math.round((step/(STEPS.length-1))*100);
  document.getElementById('progressFill').style.width = pct+'%';
  const card = document.getElementById('card');
  const isLast = step === STEPS.length-1;
  card.innerHTML = `
    <div class="step-tag">${s.tag} · Etapa ${step+1} de ${STEPS.length}</div>
    <h2 class="step-q">${s.q}</h2>
    <div id="stepBody"></div>
    <div class="field-error" id="submit-error" style="display:none;margin-bottom:10px"></div>
    <div class="actions">
      <button type="button" class="btn-back" id="btn-back" ${step===0?'style="visibility:hidden"':''}>&larr; Voltar</button>
      <button type="button" class="btn-primary" id="btn-next">${isLast? 'Enviar cadastro' : 'Continuar'}</button>
    </div>
    ${!isLast? '<div class="kbd-hint">Pressione <kbd>Enter</kbd> para continuar</div>' : ''}
  `;
  s.render(document.getElementById('stepBody'));
  document.getElementById('btn-back').addEventListener('click', goBack);
  document.getElementById('btn-next').addEventListener('click', goNext);
  card.addEventListener('keydown', enterHandler);
}
function enterHandler(e){
  if(e.key==='Enter' && e.target.tagName!=='TEXTAREA' && e.target.id!=='in-cep'){
    e.preventDefault(); goNext();
  }
}

/* ================= FINALIZAÇÃO =================
   Grava direto na tabela registro_clientes do Supabase — sem TAG (isso a equipe interna define depois,
   dentro da plataforma) e sem exigir login (RLS libera INSERT público nesta tabela especificamente;
   SELECT/UPDATE/DELETE continuam restritos à equipe interna). */
async function finalizarCadastro(){
  const payload = {
    nome: data.nome.trim(),
    cpf: data.cpf || null,
    cnpj: data.cnpj || null,
    nascimento: data.nascimento || null,
    whatsapp: data.whatsapp || null,
    email: data.email.trim(),
    cep: data.cep || null,
    endereco: data.endereco.trim(),
    numero: data.numero.trim(),
    complemento: data.complemento.trim() || null,
    bairro: data.bairro.trim(),
    estado: data.estado,
    cidade: data.cidade,
    como_conheceu: data.comoConheceu.trim() || null,
  };
  const { error } = await sb.from('registro_clientes').insert(payload);
  if(error) throw error;
}
function renderSucesso(){
  document.getElementById('progressFill').style.width = '100%';
  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="center">
      <div class="success-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
      <h2 class="step-q">Cadastro enviado!</h2>
      <p class="step-hint">Seus dados foram registrados com sucesso. Nossa equipe entrará em contato em breve.</p>
    </div>
    <div class="actions" style="justify-content:center">
      <button type="button" class="btn-primary" id="btn-novo">Registrar outra pessoa</button>
    </div>
  `;
  document.getElementById('btn-novo').addEventListener('click', resetForm);
}
function resetForm(){
  data = {nome:'',cpf:'',cnpj:'',nascimento:'',whatsapp:'',email:'',cep:'',endereco:'',numero:'',complemento:'',bairro:'',estado:'',cidade:'',comoConheceu:''};
  step = 0;
  renderStep();
}

/* ================= INÍCIO ================= */
renderStep();
</script>
</body>
</html>
